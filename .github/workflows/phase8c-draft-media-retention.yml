name: Phase 8C Draft Media Retention

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  phase8c-draft-media-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Phase 8C source and boundary contracts
        run: npx tsx --test backend/security/tests/phase8cDraftMediaRetentionSource.test.ts
