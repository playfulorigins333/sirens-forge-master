name: Frontend Launch Readiness

on:
  pull_request:
  workflow_dispatch:

jobs:
  frontend-launch-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install current npm audit client
        run: npm install --global npm@11.19.1
      - name: Production dependency audit
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        shell: bash
        run: |
          set +e
          timeout 90s npm audit --omit=dev --audit-level=high --json > "$RUNNER_TEMP/npm-audit.json" 2> "$RUNNER_TEMP/npm-audit.err"
          audit_status=$?
          set -e

          set +e
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require('node:fs')
          const path = process.argv[2]
          try {
            const report = JSON.parse(fs.readFileSync(path, 'utf8'))
            const vulnerabilities = report?.metadata?.vulnerabilities
            if (!vulnerabilities || typeof vulnerabilities !== 'object') process.exit(20)
            const high = Number(vulnerabilities.high || 0)
            const critical = Number(vulnerabilities.critical || 0)
            if (high > 0 || critical > 0) {
              console.error(`npm audit found ${high} high and ${critical} critical production vulnerabilities`)
              process.exit(10)
            }
            console.log(`npm audit passed: ${high} high, ${critical} critical production vulnerabilities`)
            process.exit(0)
          } catch {
            process.exit(20)
          }
          NODE
          report_status=$?
          set -e

          if [ "$report_status" -eq 0 ]; then
            exit 0
          fi

          if [ "$report_status" -eq 10 ]; then
            cat "$RUNNER_TEMP/npm-audit.json"
            exit 1
          fi

          echo "::warning::npm audit service unavailable or returned no valid report (command status $audit_status)."
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if git diff --quiet "origin/$BASE_REF" HEAD -- package.json package-lock.json; then
            echo "Dependency manifests are unchanged from $BASE_REF; continuing without weakening dependency-changing PRs."
            exit 0
          fi

          echo "::error::npm audit is unavailable and dependency manifests changed from $BASE_REF; failing closed."
          cat "$RUNNER_TEMP/npm-audit.err"
          exit 1
      - run: npm run test:frontend-launch-readiness
      - run: npm run test:generator-creation-loop
      - run: npm run test:private-creator-media
      - run: npm run test:final-launch-hardening
      - run: npm run test:complaints-removal-operations
      - run: npm run test:public-policy-privacy-truth
      - run: npm run test:material-policy-acceptance-source
      - run: npm run test:creator-mfa
      - run: npm run test:public-paths
      - run: npm run test:api-authorization-inventory
      - run: npm run test:launch-observability-recovery
      - run: npm run test:image-model-validation
      - run: npm run test:billing-portal-lazy-stripe
      - run: npm run test:pfc-core-02a
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://example.invalid
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: inert-placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: inert-placeholder
          STRIPE_SECRET_KEY: sk_test_inert_placeholder
          GENERATION_EXECUTION_ENABLED: "false"
      - run: git diff --check
