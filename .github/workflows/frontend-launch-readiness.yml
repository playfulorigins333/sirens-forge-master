name: Frontend Launch Readiness

on:
  pull_request:
  workflow_dispatch:

jobs:
  frontend-launch-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:frontend-launch-readiness
      - run: npm run test:generator-creation-loop
      - run: npm run test:private-creator-media
      - run: npm run test:final-launch-hardening
      - run: npm run test:complaints-removal-operations
      - run: npm run test:public-policy-privacy-truth
      - run: npm run test:material-policy-acceptance-source
      - run: npm run test:creator-mfa
      - run: npm run test:public-paths
      - run: npm run test:api-authorization-inventory
      - run: npm run test:launch-observability-recovery
      - run: npm run test:image-model-validation
      - run: npm run test:billing-portal-lazy-stripe
      - run: npm run test:pfc-core-02a
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://example.invalid
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: inert-placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: inert-placeholder
          STRIPE_SECRET_KEY: sk_test_inert_placeholder
          GENERATION_EXECUTION_ENABLED: "false"
      - run: git diff --check
