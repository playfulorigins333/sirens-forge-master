name: Phase 8J Reliability Observability

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  phase8j-reliability-observability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Phase 8J source and monitor contracts
        run: node --test backend/operations/tests/phase8jReliabilityObservability.test.mjs
      - name: API authorization inventory contract
        run: |
          npm ci
          npx tsx backend/security/tests/apiAuthorizationInventory.test.ts
