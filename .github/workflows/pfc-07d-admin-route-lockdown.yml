name: PFC-07D Admin Route Lockdown

on:
  pull_request:
    paths:
      - app/api/admin/send-affiliate-referral-emails/route.ts
      - backend/affiliate/tests/pfc07dReferralEmailRouteLockdown.test.ts
      - package.json
      - .github/workflows/pfc-07d-admin-route-lockdown.yml
  workflow_dispatch:

jobs:
  pfc-07d-admin-route-lockdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:pfc-07d
      - run: npx tsc --noEmit
      - run: git diff --check
