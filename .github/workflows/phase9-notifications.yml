name: Phase 9 Notifications
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  phase9-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phase9_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d phase9_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PHASE9_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/phase9_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - name: Phase 9 behavioral and security contracts
        run: npm run test:phase9-notifications
      - name: Phase 9 Production drift contract
        run: npx tsx --test backend/notifications/tests/phase9ProductionDriftSource.test.ts
      - name: Phase 9 PostgreSQL 17 integration
        run: npm run test:phase9-notifications-postgres
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
