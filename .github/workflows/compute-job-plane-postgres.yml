name: Compute Job Plane PostgreSQL
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  compute-job-plane-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      COMPUTE_JOB_PLANE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/compute_job_plane_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Create disposable database
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'create database compute_job_plane_test'
          psql postgresql://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'create database compute_job_plane_pass4a_test'
          psql postgresql://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'create database compute_job_plane_pass4c_test'
          psql postgresql://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'create database trainer_dataset_authority_test'
      - run: npm run test:compute-job-plane
      - run: npm run test:trainer-dataset-authority
      - run: npm run test:compute-job-plane-postgres
      - name: Run Pass 4A PostgreSQL integration and rollback
        env:
          COMPUTE_JOB_PLANE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/compute_job_plane_pass4a_test
        run: npm run test:compute-job-plane-pass4a-postgres

      - name: Run Pass 4C-A PostgreSQL integration and rollback
        env:
          COMPUTE_JOB_PLANE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/compute_job_plane_pass4c_test
        run: npm run test:compute-job-plane-pass4c-postgres

      - name: Run Trainer/Dataset authority PostgreSQL integration
        env:
          COMPUTE_JOB_PLANE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/trainer_dataset_authority_test
        run: npm run test:trainer-dataset-authority-postgres
