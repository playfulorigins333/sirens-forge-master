name: Guest Checkout Reservation PostgreSQL Integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guest-checkout-reservation-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Create disposable database
        run: psql "postgres://postgres:postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -c "create database guest_checkout_reservation_test"
      - name: Run guest reservation PostgreSQL integration
        env:
          GUEST_CHECKOUT_RESERVATION_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/guest_checkout_reservation_test
        run: node backend/billing/tests/runGuestCheckoutReservationPostgresIntegration.mjs
      - name: Upload PostgreSQL diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guest-checkout-reservation-postgres-diagnostics
          if-no-files-found: error
          path: /tmp/guest-checkout-reservation-postgres-diagnostics.log
