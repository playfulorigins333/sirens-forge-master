name: Phase 8I Launch Admin Hygiene

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  phase8i-launch-admin-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Phase 8I launch/admin hygiene contract
        run: npx tsx backend/security/tests/phase8iLaunchAdminHygiene.test.ts
      - name: Public path contract
        run: npm run test:public-paths
      - name: API authorization inventory
        run: npm run test:api-authorization-inventory
      - name: Frontend launch readiness
        run: npm run test:frontend-launch-readiness
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check HEAD^ HEAD
