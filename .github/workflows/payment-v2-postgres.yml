name: Payment V2 PostgreSQL Integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/20260801002800_payment_first_v2_contract.sql'
      - 'supabase/migrations/20260805002900_payment_v2_lifecycle_foundation.sql'
      - 'supabase/migrations/20260807003100_payment_v2_affiliate_attribution.sql'
      - 'supabase/migrations/20260807003200_affiliate_public_cutover_hardening.sql'
      - 'supabase/migrations/20260807003300_affiliate_summary_payment_v2_read_boundary.sql'
      - 'supabase/manual/**'
      - 'backend/affiliate/tests/**'
      - 'app/api/affiliate/**'
      - 'app/api/admin/affiliate-payouts/**'
      - 'app/api/stripe/connect/**'
      - 'backend/payment-v2/tests/**'
      - 'app/api/payment-v2/**'
      - 'app/login/**'
      - 'app/auth/callback/**'
      - 'app/api/webhook/payment-v2/**'
      - 'app/api/webhook/route.ts'
      - 'app/billing/**'
      - 'lib/payment-v2/**'
      - '.github/workflows/payment-v2-postgres.yml'
      - 'package.json'
      - 'app/api/checkout/subscription-v2/**'
      - 'app/api/subscription/seat-count/**'
      - 'app/page.tsx'
      - 'app/pricing/**'
      - 'instrumentation-client.ts'
      - 'next.config.mjs'
      - '.env.example'
      - 'package-lock.json'
  workflow_dispatch:
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PAYMENT_V2_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Payment-first Checkout Protection and Inventory V2 behavioral contract
        run: npm run test:pfc-07b1
      - name: Payment-first Checkout V2 behavioral contract
        run: npm run test:pfc-03
      - name: Payment-first Webhook V2 behavioral contract
        run: npm run test:pfc-04
      - name: Payment-first Claim V2 behavioral contract
        run: npm run test:pfc-05
      - name: Payment-first Billing Result V2 behavioral contract
        run: npm run test:pfc-06a
      - name: Payment-first Auth Continuation V2 behavioral contract
        run: npm run test:pfc-06b
      - name: PFC-07E-A1 dormant lifecycle foundation tests
        run: npm run test:pfc-07e-a1
      - name: Payment V2 affiliate restoration contract
        run: npm run test:pfc-core-03b
      - name: Supplemental source contract
        run: npm run test:payment-v2-contract
      - name: Production-equivalent Payment V2 affiliate PostgreSQL behavior
        run: npm run test:pfc-core-03b-postgres
      - name: Affiliate public-cutover hardening contracts
        run: npm run test:pfc-core-03d
      - name: Affiliate public-cutover hardening disposable PostgreSQL behavior
        run: npm run test:pfc-core-03d-postgres
      - name: Affiliate summary authenticated read-boundary PostgreSQL behavior
        run: npm run test:pfc-core-03f-postgres
      - name: PRE-03100 backup and rollback static contract
        run: npm run test:pfc-core-03c
      - name: PRE-03100 backup and rollback disposable PostgreSQL integration
        run: npm run test:pfc-core-03c-postgres
      - name: Disposable PostgreSQL behavior and concurrency
        run: npm run test:payment-v2-postgres
