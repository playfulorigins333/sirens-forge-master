name: LOCK-05B Profile Credential Containment

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/lock05b-profile-credential-containment.yml
      - backend/security/tests/lock05bProfileCredentialContainment.test.ts
      - backend/security/tests/runLock05bPostgresIntegration.mjs
      - supabase/manual/lock05b_profile_credential_containment_rollback.sql
      - supabase/migrations/20260811043000_lock05b_profile_credential_containment.sql

permissions:
  contents: read

jobs:
  lock05b-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LOCK05B_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lock05b_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Create disposable database
        run: psql postgres://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'create database lock05b_test'
      - name: Static source contract
        run: npx tsx backend/security/tests/lock05bProfileCredentialContainment.test.ts
      - name: Disposable PostgreSQL behavior
        run: node backend/security/tests/runLock05bPostgresIntegration.mjs
