name: Private Creator Media PostgreSQL

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  private-creator-media-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PRIVATE_CREATOR_MEDIA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/private_creator_media_test
      PHASE7_PRIVATE_MEDIA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/phase7_private_media_test
      PHASE7_TWIN_TRAINING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/phase7_twin_training_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: One-shot canonical authorization inventory patch
        if: github.event.pull_request.number == 335
        run: |
          git fetch origin phase7-twin-training-lifecycle
          git checkout -B phase7-twin-training-lifecycle origin/phase7-twin-training-lifecycle
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/security/api-authorization-inventory.md')
          text = path.read_text()
          marker = '| `/api/library/twins/[twinId]/purge` |'
          if marker not in text:
              text = re.sub(r'\*\*Reviewed source baseline:\*\* `[^`]+`', '**Reviewed source baseline:** `302a3c988848e3a86f53be29965f6e2762eff7d9`', text, count=1)
              text = text.replace('**Inventory:** 110 route files / 131 route-method entries', '**Inventory:** 114 route files / 135 route-method entries', 1)
              anchor = '| `/api/library/assets/[assetId]/trash` | `app/api/library/assets/[assetId]/trash/route.ts` | `POST` | Authenticated creator moving owned private generated media to Recently Deleted | AUTHENTICATED + OWNER + ENTITLED | Shared Library lifecycle route calls `ensureActiveSubscription()` before lifecycle work and derives the authenticated Supabase user | Canonical asset UUID and authenticated user ID are passed to the owner-bound trash RPC; caller cannot choose another owner | Active subscription and current material-policy acceptance are required by `ensureActiveSubscription()` | None | None | Supabase service-role client invokes only the owner-bound trash lifecycle RPC after authentication/entitlement | Valid owned active media moves to `trashed` with the 30-day purge window; foreign/invalid IDs and incompatible states fail closed with bounded errors | PASS | `app/api/library/assets/[assetId]/trash/route.ts`; `app/api/library/assets/[assetId]/lifecycleRoute.ts`; `lib/private-creator-media/lifecycle.ts`; private creator media tests; inventory contract test |'
              rows = '''
| `/api/library/twins/[twinId]/purge` | `app/api/library/twins/[twinId]/purge/route.ts` | `POST` | Authenticated creator permanently deleting an owned AI Twin | AUTHENTICATED + OWNER + ENTITLED | Shared Twin lifecycle route calls `ensureActiveSubscription()` before privileged lifecycle work | Canonical Twin UUID is bound to `auth.user.id`; service code and lifecycle RPCs recheck `user_loras.user_id` before purge claim/finalize | Active subscription and current material-policy acceptance are required | None | Server-only Railway internal secret is used only after the owner-bound purge claim; no browser-supplied storage authority | Service role performs owner-bound claim/finalize; Railway derives canonical Twin storage namespaces and the server-side R2 bucket | Active Twin cannot be permanently purged directly; active compute, recent upload windows, and conflicting purge claims fail closed; errors are bounded | PASS | `app/api/library/twins/[twinId]/purge/route.ts`; `app/api/library/twins/[twinId]/lifecycleRoute.ts`; `lib/twin-lifecycle.ts`; Phase 7 Twin lifecycle tests; inventory contract test |
| `/api/library/twins/[twinId]/restore` | `app/api/library/twins/[twinId]/restore/route.ts` | `POST` | Authenticated creator restoring an owned AI Twin from Recently Deleted | AUTHENTICATED + OWNER + ENTITLED | Shared Twin lifecycle route calls `ensureActiveSubscription()` and derives the authenticated user | Canonical Twin UUID and authenticated user ID are passed to the owner-bound restore RPC | Active subscription and current material-policy acceptance are required | None | None | Service-role RPC is invoked only after authentication and entitlement | Restore is limited to owned `trashed` Twins inside the 30-day recovery window; invalid, foreign, and state-conflict cases are bounded | PASS | `app/api/library/twins/[twinId]/restore/route.ts`; `app/api/library/twins/[twinId]/lifecycleRoute.ts`; `lib/twin-lifecycle.ts`; Phase 7 Twin lifecycle tests; inventory contract test |
| `/api/library/twins/[twinId]/training-data/purge` | `app/api/library/twins/[twinId]/training-data/purge/route.ts` | `POST` | Authenticated creator permanently deleting owned Twin training data without deleting the trained Twin | AUTHENTICATED + OWNER + ENTITLED | Shared Twin lifecycle route calls `ensureActiveSubscription()` before lifecycle work | Canonical Twin UUID is bound to `auth.user.id`; owner-bound claim/finalize RPCs select only that creator's Twin | Active subscription and current material-policy acceptance are required | None | Server-only Railway internal secret is used after the owner-bound training-data purge claim | Service role claims/finalizes metadata cleanup; Railway derives only canonical Twin-owned training-data prefixes and never accepts caller bucket/key/prefix authority | Active Trainer and recent signed-upload windows block physical purge; trained artifact and existing generated media are preserved; errors are bounded | PASS | `app/api/library/twins/[twinId]/training-data/purge/route.ts`; `app/api/library/twins/[twinId]/lifecycleRoute.ts`; `lib/twin-lifecycle.ts`; Phase 7 Twin lifecycle tests; inventory contract test |
| `/api/library/twins/[twinId]/trash` | `app/api/library/twins/[twinId]/trash/route.ts` | `POST` | Authenticated creator moving an owned AI Twin to Recently Deleted | AUTHENTICATED + OWNER + ENTITLED | Shared Twin lifecycle route calls `ensureActiveSubscription()` before lifecycle work | Canonical Twin UUID and authenticated user ID are passed to the owner-bound trash RPC | Active subscription and current material-policy acceptance are required | None | None | Service-role RPC is invoked only after authentication and entitlement | Owned active Twin moves to `trashed` with a 30-day recovery window; new Image, Trainer, Dataset Doctor, and Video use is independently blocked by lifecycle gates | PASS | `app/api/library/twins/[twinId]/trash/route.ts`; `app/api/library/twins/[twinId]/lifecycleRoute.ts`; `lib/twin-lifecycle.ts`; Phase 7 Twin lifecycle tests; inventory contract test |'''
              if anchor not in text:
                  raise SystemExit('inventory anchor not found')
              text = text.replace(anchor, anchor + rows, 1)
              text = text.replace('- PASS: **131**', '- PASS: **135**', 1)
              path.write_text(text)
          PY
          if ! git diff --quiet -- docs/security/api-authorization-inventory.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/security/api-authorization-inventory.md
            git commit -m "Document Phase 7 Twin route authorization"
            git push origin HEAD:phase7-twin-training-lifecycle
          fi
      - name: Create disposable databases
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'create database private_creator_media_test'
          psql postgresql://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'create database phase7_private_media_test'
          psql postgresql://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'create database phase7_twin_training_test'
      - name: Private creator media source contracts
        run: npm run test:private-creator-media
      - name: Phase 7 Twin and training-data source contracts
        run: npx tsx --test backend/security/tests/phase7TwinTrainingLifecycleSource.test.ts
      - name: Private creator media PostgreSQL behavior
        run: npm run test:private-creator-media-postgres
      - name: Phase 7 private media lifecycle PostgreSQL behavior
        run: node backend/security/tests/runPhase7PrivateMediaLifecyclePostgres.mjs
      - name: Phase 7 Twin and training-data lifecycle PostgreSQL behavior
        run: node backend/security/tests/runPhase7TwinTrainingLifecyclePostgres.mjs
